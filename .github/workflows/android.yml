name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and add Android platform
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          python3 setup_android.py
          npx cap sync android
      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk bus-tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bus-tracker-apk
          path: bus-tracker.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Android build ${{ github.run_number }}
          files: bus-tracker.apk
          make_latest: true
